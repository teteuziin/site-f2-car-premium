name: Renomear para index.html

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  renomear:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Renomear arquivo para index.html
        run: |
          git mv landing-page-f2-car-premium.html index.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Renomear landing-page-f2-car-premium.html para index.html"
          git push
